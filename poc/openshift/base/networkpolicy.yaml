apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: opf-synthetic-lab-isolation}
spec:
  podSelector: {matchLabels: {app: opf-synthetic-lab}}
  policyTypes: [Ingress, Egress]
  ingress: []  # default no inbound until an approved client policy is added
  egress: []   # demo mock uses no external dependencies
